name: Build and Deploy

on:
  repository_dispatch:
    types: [strapi-publish]

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
      STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Wake up Strapi (Admin Check)
        run: |
          echo "Pinging Strapi Admin at ${NEXT_PUBLIC_STRAPI_URL}/admin"
          for i in {1..20}; do
            # Get the HTTP status code
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${NEXT_PUBLIC_STRAPI_URL}/admin")

            echo "Attempt $i: Received Status Code $STATUS"

            # If it's 200, the server is fully booted
            if [ "$STATUS" -eq 200 ]; then
              echo "Strapi is awake!"
              exit 0
            fi

            sleep 5
          done
          echo "Error: Strapi Admin failed to respond with 200 after 100 seconds."
          exit 1

      - name: Build Project
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_PATH }}
